# exemplo-jdbc/docker-compose.yml
# Banco de apoio para a demonstracao. Repare que o compose le a MESMA
# variavel de ambiente que a aplicacao: a senha nao esta em lugar nenhum
# deste repositorio.
services:
  postgres:
    image: postgres:16-alpine
    container_name: exemplo-jdbc-postgres
    environment:
      POSTGRES_DB: loja
      POSTGRES_USER: loja_app
      POSTGRES_PASSWORD: ${JDBC_PASSWORD:?defina JDBC_PASSWORD antes de subir o container}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja_app -d loja"]
      interval: 5s
      retries: 10
